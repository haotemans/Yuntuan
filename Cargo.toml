[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-api",
    "crates/adapter-qq",
    "crates/webui",
    "crates/yuantuan",
    "plugins/anysearch",
    "plugins/social-media",
    "plugins/nai-image",
    "plugins/tencent-docs",
    "plugins/quark-drive",
    "plugins/qq",
    "crates/mcp-http",
]

[workspace.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
