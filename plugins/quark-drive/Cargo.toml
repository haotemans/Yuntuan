[package]
name = "yuantuan-plugin-quark-drive"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["process", "time", "io-util", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
