[package]
name = "yuantuan-plugin-qq"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
