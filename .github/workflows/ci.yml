name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  feature-doc-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify module docs, links and source ownership
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check_feature_docs.py --base "origin/$BASE_REF"
          else
            python3 scripts/check_feature_docs.py
          fi

  meme-gallery-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: webui-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Meme gallery browser tests
        working-directory: webui-frontend
        run: npm run test:memes
      - name: Relationship graph browser tests
        working-directory: webui-frontend
        run: npm run test:relations
      - name: Memory browser tests
        working-directory: webui-frontend
        run: npm run test:memories
      - name: Task runtime browser tests
        working-directory: webui-frontend
        run: npm run test:tasks
      - name: Agent schedule and sandbox browser tests
        working-directory: webui-frontend
        run: npx playwright test agent-schedules.spec.js
      - name: Bot management browser tests
        working-directory: webui-frontend
        run: npx playwright test management-flow.spec.js
      - name: Decision scheduling browser tests
        working-directory: webui-frontend
        run: npm run test:trace
      - name: Dashboard event stream browser tests
        working-directory: webui-frontend
        run: npx playwright test dashboard-flow.spec.js
      - name: Runtime console browser tests
        working-directory: webui-frontend
        run: npx playwright test logs-flow.spec.js
      - name: Plugin tool controls browser tests
        working-directory: webui-frontend
        run: npm run test:plugins
      - name: Model configuration browser tests
        working-directory: webui-frontend
        run: npm run test:models
      - name: Platform connection browser tests
        working-directory: webui-frontend
        run: npx playwright test platforms-flow.spec.js

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      - name: Rust toolchain (stable + musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: musl-tools（bundled sqlite 的 C 编译需要 musl-gcc）
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: 前端构建（产物直写 crates/webui/static，rust-embed 随包体编译）
        working-directory: webui-frontend
        run: |
          npm ci
          npm run build

      - name: 全量测试（mock WS/LLM、SQLx 存储，不依赖外部服务）
        run: |
          cargo test --locked -p yuantuan-mcp-http
          cargo test --locked -p yuantuan-plugin-tencent-docs -p yuantuan-plugin-quark-drive
          cargo test --locked -p yuantuan-core --lib scheduler::tests
          cargo test --locked -p yuantuan-core --lib scheduler::agents::tests
          cargo test --locked -p yuantuan-webui --test pages_api connector_probe
          cargo test --locked -p yuantuan-plugin-qzone
          cargo test --locked -p yuantuan-core --test qzone_host
          cargo test --locked -p yuantuan-adapter-qq --lib qzone
          cargo test --locked -p yuantuan-core --lib bot::tests::plugin_command_works_without_models_and_keeps_output_as_text
          cargo test --locked -p yuantuan-plugin-moderator
          cargo test --locked -p yuantuan-adapter-qq --lib moderation
          cargo test --locked -p yuantuan-core --lib bot::dispatch_tests
          cargo test --locked -p yuantuan-core --lib engagement::tests
          cargo test --locked -p yuantuan-core --test tool_usability
          cargo test --locked -p yuantuan-core --test management --test plugin_host
          cargo test --locked -p yuantuan-core --test tool_protocol
          cargo test --locked -p yuantuan-core --test task_brief
          cargo test --locked -p yuantuan-core --test bot_context
          cargo test --locked -p yuantuan-core --test working_context
          cargo test --locked -p yuantuan-core --lib reply_engine::freshness
          cargo test --locked -p yuantuan-core --lib window::tests
          cargo test --locked -p yuantuan-core --test membership
          cargo test --locked -p yuantuan-core --lib owned_
          cargo test --locked -p yuantuan-core --test visual_context --test visual_followup --test visual_registered
          cargo test --locked -p yuantuan-core --test context_runtime --test agent_loop --test profile_refresh --test consolidation --test memory_storage
          cargo test --locked -p yuantuan-webui --test pages_api task_runtime_exposes_versioned_requirements
          cargo test --locked -p yuantuan-webui --test memories_api
          cargo test --locked -p yuantuan-webui --test memes_api
          cargo test --locked -p yuantuan-adapter-qq --test meme --test reply
          cargo test --locked --workspace

      - name: Docker connector runtime smoke
        run: |
          docker build --target connector-runtime -t yuantuan-connector-runtime:ci .
          docker run --rm --entrypoint node yuantuan-connector-runtime:ci --version

      - name: Docker Bash sandbox execution (no external model)
        run: |
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t yuantuan-sandbox:local deploy/sandbox
          cargo test --locked -p yuantuan-core --test sandbox_docker -- --ignored --nocapture
          docker save yuantuan-sandbox:local | gzip > /tmp/yuantuan-sandbox.tar.gz

      - name: Upload validated Bash sandbox image
        uses: actions/upload-artifact@v4
        with:
          name: yuantuan-sandbox-linux-x86_64
          path: /tmp/yuantuan-sandbox.tar.gz

      - name: Quark private worker native execution (no external account)
        run: |
          node --test plugins/quark-drive/worker/job.test.cjs
          docker build -f deploy/quark-tools.Dockerfile --label org.opencontainers.image.revision=${{ github.sha }} -t yuantuan-quark-tools:ci .
          python3 plugins/quark-drive/worker/smoke.py --image yuantuan-quark-tools:ci
          docker save yuantuan-quark-tools:ci | gzip > /tmp/yuantuan-quark-tools.tar.gz

      - name: Upload validated Quark worker image
        uses: actions/upload-artifact@v4
        with:
          name: yuantuan-quark-tools-linux-x86_64
          path: /tmp/yuantuan-quark-tools.tar.gz

      - name: musl release 构建
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p yuantuan

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yuantuan-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/yuantuan

  build-windows:
    # Routine Windows validation runs locally; keep hosted packaging for releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      - name: Rust toolchain (stable + MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: 前端构建
        working-directory: webui-frontend
        run: |
          npm ci
          npm run build

      - name: 全量测试
        run: |
          cargo test --locked -p yuantuan-webui --test memes_api
          cargo test --locked -p yuantuan-adapter-qq --test meme --test reply
          cargo test --locked --workspace

      - name: MSVC release 构建
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p yuantuan

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yuantuan-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/yuantuan.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: yuantuan-linux-x86_64

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: yuantuan-windows-x86_64

      - name: 校验和与打包
        run: |
          mv yuantuan yuantuan-linux-x86_64
          mkdir -p dist
          zip -j dist/yuantuan-windows-x86_64.zip yuantuan.exe
          sha256sum yuantuan-linux-x86_64 > dist/yuantuan-linux-x86_64.sha256
          mv yuantuan-linux-x86_64 dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
