[package]
name = "yuantuan"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-tencent-docs = { path = "../../plugins/tencent-docs", optional = true }
yuantuan-plugin-quark-drive = { path = "../../plugins/quark-drive", optional = true }
yuantuan-plugin-qzone = { path = "../../plugins/qzone", optional = true }
yuantuan-plugin-qq = { path = "../../plugins/qq", optional = true }
yuantuan-plugin-moderator = { path = "../../plugins/moderator", optional = true }
yuantuan-plugin-anysearch = { path = "../../plugins/anysearch", optional = true }
yuantuan-plugin-nai-image = { path = "../../plugins/nai-image", optional = true }
yuantuan-plugin-api = { path = "../plugin-api" }
yuantuan-core = { path = "../core" }
yuantuan-adapter-qq = { path = "../adapter-qq" }
yuantuan-webui = { path = "../webui" }
yuantuan-plugin-social-media = { path = "../../plugins/social-media", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
plugin-tencent-docs = ["dep:yuantuan-plugin-tencent-docs"]
plugin-quark-drive = ["dep:yuantuan-plugin-quark-drive"]
plugin-qzone = ["dep:yuantuan-plugin-qzone"]
plugin-qq = ["dep:yuantuan-plugin-qq"]
plugin-anysearch = ["dep:yuantuan-plugin-anysearch"]
default = ["plugin-social-media", "plugin-anysearch", "plugin-moderator", "plugin-nai-image", "plugin-qzone", "plugin-qq", "plugin-tencent-docs", "plugin-quark-drive"]
plugin-moderator = ["dep:yuantuan-plugin-moderator"]
plugin-nai-image = ["dep:yuantuan-plugin-nai-image"]
plugin-social-media = ["dep:yuantuan-plugin-social-media"]

[build-dependencies]
toml = "0.8"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-moderator"
feature = "plugin-moderator"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-social-media"
feature = "plugin-social-media"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-anysearch"
feature = "plugin-anysearch"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-nai-image"
feature = "plugin-nai-image"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-qzone"
feature = "plugin-qzone"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-qq"
feature = "plugin-qq"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-tencent-docs"
feature = "plugin-tencent-docs"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-quark-drive"
feature = "plugin-quark-drive"
