[package]
name = "yuantuan-mcp-http"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread"] }
